<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式词云展示</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 80%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .word-cloud {
            display: block;
            text-align: center;
            min-height: 400px;
            position: relative;
            line-height: 1.8;
            padding: 20px;
        }

        .word {
            display: inline;
            margin: 0 8px;
            padding: 5px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Arial', sans-serif;
        }

        .word:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            font-size: 18px;
            color: #333;
            min-width: 200px;
            text-align: center;
        }

        .popup-content {
            margin-bottom: 15px;
        }

        .close-btn {
            display: inline-block;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .close-btn:hover {
            background-color: #45a049;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>交互式词云展示</h1>
    <div class="word-cloud" id="wordCloud"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <div class="popup-content" id="popupContent"></div>
    <button class="close-btn" id="closeBtn">关闭</button>
</div>

</body>
</html>
